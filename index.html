<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c4a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mijn Voeding">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css">
<title>Mijn Voeding</title></head><body>
<main id="app"></main><nav id="nav"></nav>
<button id="inst" hidden style="position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;min-height:40px;padding:0 12px;border-radius:10px;border:0;background:#1f7a56;color:#fff;font:600 14px system-ui">App installeren</button>
<script src="app.js"></script>
<script>
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;inst.hidden=false});
inst.onclick=async()=>{dp.prompt();await dp.userChoice;inst.hidden=true};
addEventListener('appinstalled',()=>{inst.hidden=true});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
</script></body></html>
